<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Tera Support for app issues, feedback, or account deletion requests." />
  <title>Tera Support</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FAF8F5;
      --ink: #1A1714;
      --ink-soft: #4A4440;
      --accent: #9C4530;
      --rule: #E8E2DB;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--cream);
      color: var(--ink);
      font-family: 'Instrument Sans', sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    header { padding: 32px 40px; border-bottom: 1px solid var(--rule); }
    .logo { display: inline-flex; }
    .logo img { display: block; width: 84px; height: auto; }
    main { width: 100%; max-width: 760px; margin: 0 auto; padding: 80px 40px; flex: 1; }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 16px; }
    h1 { font-size: clamp(32px, 6vw, 42px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 28px; }
    .contact-box { background: white; border: 1px solid var(--rule); border-radius: 12px; padding: 28px 32px; }
    p { color: var(--ink-soft); }
    a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:hover { color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .privacy-link { margin-top: 24px; }
    footer { border-top: 1px solid var(--rule); padding: 28px 32px; text-align: center; font-size: 12px; color: var(--ink-soft); }
    .footer-links { display: inline-flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-left: 10px; }
    .footer-links a { color: inherit; }
    @media (max-width: 480px) {
      header { padding: 24px; }
      main { padding: 52px 24px; }
      .contact-box { padding: 24px; }
      .footer-links { display: flex; margin: 12px 0 0; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/" aria-label="Tera home">
      <img src="/assets/tera-wordmark.png" alt="Tera" />
    </a>
  </header>
  <main>
    <p class="eyebrow">Here to help</p>
    <h1>Tera Support</h1>
    <div class="contact-box">
      <p>Need help with Tera? For app issues, feedback, or account deletion requests, contact <a href="mailto:team@tryteraapp.com">team@tryteraapp.com</a>.</p>
    </div>
    <p class="privacy-link">Read our <a href="/privacy">Privacy Policy</a>.</p>
  </main>
  <footer>
    © 2026 Tera Digital Inc. All rights reserved.
    <nav class="footer-links" aria-label="Footer">
      <a href="/terms">Terms &amp; Conditions</a>
      <a href="/privacy">Privacy Policy</a>
      <a href="/support" aria-current="page">Support</a>
    </nav>
  </footer>
</body>
</html>
